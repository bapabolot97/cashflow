name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase Database
        run: |
          node << 'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const url = html.match(/var SUPABASE_URL\s*=\s*'([^']+)'/)[1];
          const key = html.match(/var SUPABASE_ANON_KEY\s*=\s*'([^']+)'/)[1];
          (async () => {
            const res = await fetch(`${url}/rest/v1/rpc/resolve_user_email`, {
              method: 'POST',
              headers: {
                apikey: key,
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ p_identifier: 'admin' })
            });
            const text = await res.text();
            console.log('Supabase ping HTTP:', res.status, text);
            if (!res.ok) process.exit(1);
          })();
          EOF
